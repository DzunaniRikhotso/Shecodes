<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      h1 {
        color:#885df1 ;
        font-size: 40px;
        text-decoration: underline;
        text-align: center;
      }
      h2 {
        color:#272044 ;
        font-weight: normal;
        text-align: center;
      }

      body {
        background-color: #f5f0fe;
      }

      body {
        display: block;
        margin: 8px;
      }

      p {
        text-align: center;
      }

      img {
        display: block;
        margin: 0 auto;
      }

      button {
        border: 1px solid #885df1;
        border-radius: 30px;
        box-shadow: 2px 5px 5px rgba(0, 0, 0, 0.2);
        margin: 20px auto;
        display: block;
        color: #885df1;
        font-size: 16px;
        background: transparent;
        padding: 15px 20px;
        transition: all 200ms ease;
      }

      button:hover {
        background: #885df1;
        color: white;

      }



      .coders {
        color: blue;
      }

      .courses {
        color: red;
      }

      .stories {
        color: green;
      }

      .contact-platform {
        color: #885df1;
      }

      .contact-details {
        text-align: center;
        font-size: 12px;
      }

      li {
        display: inline;
        margin: 0 15px;
      }

      ul {
        list-style: none;
        padding: 0;
        text-align: center;
      }

      a {
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
</head>
<body>

  SheCodes
</h1>

</h2>
<button>

    </a>
  </li>
  <li>
    <a href="https://www.shecodes.io/workshops"
       target="_blank"
       class="courses"
       >
      Courses
    </a>
  </li>
  <li>
    <a href="https://www.shecodes.io/stories"
       target="_blank"
       class="stories"
       >
      Stories
    </a>
  </li>
