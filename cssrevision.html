<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      h1 {
        text-align: center;
        color: #272044;
        font-weight: 900;
        font-size: 34px;
        line-height: 48px;
        margin: 60px 0 0;
      }
      h2 {
        text-align: center;
        color: #8064e9;
        font-size: 34px;
        font-weight: 900;
        margin: 0;
        line-height: 48px;
        padding: 0 0 24px;
      }

      p {
        text-align: center;
        font-size: 18px;
        line-height: 28px;
        font-family: PT Mono, monospace;
      }

      button {
        display: block;
        margin: 0 auto;
        border-radius: 25px;
        border: 1px solid #8064e9;
        background: #8064e9;
        color: #fff;
        font-size: 16px;
        line-height: 22px;
        padding: 16px 24px;
        text-decoration: none;
        transition: all 200ms ease;
        box-shadow: rgba(37, 39, 89, 0.08) 0px 8px 8px 0;
      }

      button:hover {
        cursor: pointer;
        background: #5e41a7;
      }
    </style>
  </head>
  <body>
    <h1>👩‍💻 SheCodes is a Coding Workshop for Women</h1>

    <h2>Access a new career in Technology</h2>

    <p>
      SheCodes teaches coding, design and management skills to women <br />
      <strong> Limited number of spots available! </strong>
    </p>

    <button>Join now</button>
  </body>
</html>
