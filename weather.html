<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Html / Css</title>
    <style>
      h1 {
        color: #1a64d6;
        text-align: center;
        font-size: 34px;
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        line-height: 48px;
      }

      h2 {
        font-weight: 100;
        text-align: center;
        margin: 0;
        font-size: 34px;
        font-family: Arial, Helvetica, sans-serif;
        line-height: 48px;
        font-weight: 400;
      }

      strong {
        font-weight: bold;
      }
      ul {
        list-style: none;
        padding: 10px 0;
        margin: 0 auto;
        text-align: center;
      }

      li {
        padding: 10px 0;
        border-radius: 10px;
        transition: all 200ms ease-in-out;
        max-width: 400px;
        margin: 0 auto;
      }
      li:hover {
        background: rgb(252, 243, 247);
      }

      h3 {
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 18.79px;
        display: block;
      }

      p {
        font-size: 18px;
        opacity: 0.7;
        text-align: center;
        font-family: monospace;
      }

      button {
        border: 1px solid #1a64d6;
        border-radius: 30px;
        box-shadow: rgba(37, 39, 89, 0.08) 0px 8px 8px 0;
        margin: 20px auto;
        display: block;
        color: #fff;
        font-size: 16px;
        background: #1a64d6;
        padding: 15px 24px;
        transition: all 200ms ease;
        cursor: pointer;
        line-height: 22px;
      }

      button:hover {
        background: #fff;
        color: #1a64d6;
      }
    </style>
  </head>
  <body>
    <h1>
      ⛅
      <br />
      Currently 21&deg; in Tokyo
    </h1>
    <h2>
      13&deg; /
      <strong> 23&deg; </strong>
    </h2>
    <ul>
      <li>
        <h3>🌨 Tomorrow</h3>
        <p>
          10&deg; /
          <strong> 22&deg; </strong>
        </p>
      </li>

      <li>
        <h3>🌥 Saturday</h3>

        <p>
          15&deg; /
          <strong> 17&deg; </strong>
        </p>
      </li>

      <li>
        <h3>☀ Sunday</h3>

        <p>
          25&deg; /
          <strong> 28&deg; </strong>
        </p>
      </li>
    </ul>

    <button>Change city</button>

    <p>Coded by Alicia Rikhotso</p>
  </body>
</html>
