<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Transform</title>
    <style>
      body {
        margin: 200px;
      }
      img {
        width: 200px;
      }
      .athens-picture-1 {
        transform: scale(0.5) rotate(75deg);
      }
      .athens-picture-2 {
        transform: rotate(120deg);
      }
      .athens-picture-3 {
        transform: scale(1.5) translateY(-50px) rotate(-25deg);
      }
      .athens-picture-4 {
        transform: scale(0.8) translateX(-100px) rotate(50deg);
      }
    </style>
  </head>
  <body>
    <img
      src="https://www.travelanddestinations.com/wp-content/uploads/2021/11/Athens-skyline-Greece.jpg"
      alt
      class="athens-picture-1"
    />
    <img
      src="https://pohcdn.com/sites/default/files/styles/paragraph__live_banner__lb_image__1880bp/public/live_banner/Athens-2.jpg"
      alt
      class="athens-picture-2"
    />
    <img
      src="https://www.newmarketholidays.co.uk/media/o2mnngsw/sh_1193397715-athens-greece.jpg"
      alt
      class="athens-picture-3"
    />
    <img
      src="https://i.natgeofe.com/n/f873d441-d6ae-4436-94e3-57c41452a8e2/market-athens-greece.jpg"
      alt
      class="athens-picture-4"
    />
  </body>
</html>
